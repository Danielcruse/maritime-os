name: maritime-os

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: maritime
      POSTGRES_PASSWORD: maritime
      POSTGRES_DB: maritime_os
    ports:
      - "5432:5432"
    volumes:
      - maritime_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maritime -d maritime_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  maritime_db_data:
